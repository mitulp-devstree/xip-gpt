<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Search</title>
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Color Palette - Premium Dark Theme */
            --bg-primary: #0f172a;     /* Slate 900 */
            --bg-secondary: #1e293b;   /* Slate 800 */
            --bg-tertiary: #334155;    /* Slate 700 */
            
            --accent-primary: #3b82f6; /* Blue 500 */
            --accent-hover: #2563eb;   /* Blue 600 */
            --accent-glow: rgba(59, 130, 246, 0.4);
            
            --text-primary: #f8fafc;   /* Slate 50 */
            --text-secondary: #94a3b8; /* Slate 400 */
            --text-muted: #64748b;     /* Slate 500 */
            
            --border-color: rgba(255, 255, 255, 0.1);
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.05);
            
            --success: #10b981;
            --error: #ef4444;

            --font-family: 'Inter', sans-serif;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Base Layout */
        .app-container {
            display: flex;
            width: 100%;
            height: 100vh;
            background: radial-gradient(circle at top right, #1e293b 0%, #0f172a 100%);
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px;
            z-index: 10;
        }

        .sidebar-header h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-content {
            flex: 1;
        }

        .nav-section h3 {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .caption {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .primary-btn {
            width: 100%;
            padding: 12px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-family: var(--font-family);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .primary-btn:hover {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px var(--accent-glow);
            transform: translateY(-1px);
        }

        .primary-btn:active {
            transform: translateY(1px);
        }

        /* Status Boxes */
        .status-box {
            margin-top: 16px;
            padding: 12px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
        }
        .status-box.success { border-left: 4px solid var(--success); }
        .status-box.error { border-left: 4px solid var(--error); }
        .hidden { display: none; }

        /* Connection Status */
        .sidebar-footer {
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }

        .ws-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-muted);
        }

        .ws-status.connected .pulse-dot {
            background-color: var(--success);
            box-shadow: 0 0 8px var(--success);
            animation: pulse 2s infinite;
        }

        .ws-status.disconnected .pulse-dot {
            background-color: var(--error);
            box-shadow: 0 0 8px var(--error);
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }


        /* Main Chat Area */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }

        .chat-header {
            padding: 24px 40px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(10px);
        }

        .chat-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .chat-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Chat History */
        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 32px;
            scroll-behavior: smooth;
        }

        .chat-history::-webkit-scrollbar {
            width: 6px;
        }
        .chat-history::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-history::-webkit-scrollbar-thumb {
            background: var(--bg-tertiary);
            border-radius: 10px;
        }

        .message {
            display: flex;
            gap: 16px;
            max-width: 85%;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-msg {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .assistant-msg {
            align-self: flex-start;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .user-msg .avatar {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .assistant-msg .avatar {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
        }

        .message-content {
            background: var(--bg-secondary);
            padding: 16px 20px;
            border-radius: var(--radius-lg);
            line-height: 1.6;
            font-size: 0.95rem;
            color: var(--text-primary);
            box-shadow: var(--shadow-md);
            position: relative;
            white-space: pre-wrap; /* For markdown newlines */
        }

        .user-msg .message-content {
            background: var(--bg-tertiary);
            border-bottom-right-radius: 4px;
        }

        .assistant-msg .message-content {
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }

        /* Typewriter Cursor */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background-color: var(--accent-primary);
            vertical-align: middle;
            animation: blink 1s step-end infinite;
            margin-left: 2px;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* Candidate Cards Container inside Chat Bubble */
        .candidates-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .candidate-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .candidate-card:hover {
            background: rgba(30, 41, 59, 0.8);
            border-color: var(--accent-primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .cand-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .cand-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #e2e8f0;
        }

        .cand-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .cand-skills {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .skill-tag {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            border: 1px solid var(--border-color);
        }

        .raw-data-btn {
            background: transparent;
            border: none;
            color: var(--accent-primary);
            font-size: 0.8rem;
            cursor: pointer;
            font-family: inherit;
            transition: color 0.2s;
        }

        .raw-data-btn:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        /* Input Area */
        .chat-input-area {
            padding: 24px 40px 40px 40px;
            background: linear-gradient(180deg, transparent 0%, var(--bg-primary) 100%);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 8px 16px;
            box-shadow: var(--shadow-glass);
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        #userInput {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 1rem;
            padding: 12px 8px;
            outline: none;
            font-family: var(--font-family);
        }

        #userInput::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            background: var(--accent-primary);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .send-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            background: var(--bg-tertiary);
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fa-solid fa-brain nav-icon"></i> XIP GPT</h2>
            </div>
            <div class="sidebar-content">
                <div class="nav-section">
                    <h3>Data Ingestion</h3>
                    <p class="caption">Re-index all resumes from MongoDB into the vector store.</p>
                    <button id="ingestBtn" class="primary-btn">
                        <i class="fa-solid fa-rotate"></i> Run Ingestion
                    </button>
                    <div id="ingestStatus" class="status-box hidden"></div>
                </div>
            </div>
            <div class="sidebar-footer">
                <div class="ws-status connected" id="wsStatusIndicator">
                    <div class="pulse-dot"></div>
                    <span id="wsStatusText">Connected</span>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-container">
            <header class="chat-header">
                <h1>Candidate Discovery</h1>
                <p>Chat with the AI to find, filter, and evaluate candidates instantly.</p>
            </header>

            <div class="chat-history" id="chatHistory">
                <!-- Welcome Message -->
                <div class="message assistant-msg">
                    <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                    <div class="message-content">
                        <p>Hi there! I'm your AI recruiter. Ask me to find candidates, filter by skills, or explore specific profiles.</p>
                    </div>
                </div>
            </div>

            <div class="chat-input-area">
                <form id="chatForm">
                    <div class="input-wrapper">
                        <input type="text" id="userInput" placeholder="Ask for developers, data engineers..." autocomplete="off" required>
                        <button type="submit" id="sendBtn" class="send-btn">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- DOM Purify to prevent XSS from Markdown to HTML conversions (if we add basic bolding later) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.3/purify.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- WebSocket Logic ---
            const wsStatusText = document.getElementById('wsStatusText');
            const wsStatusIndicator = document.getElementById('wsStatusIndicator');
            const chatHistory = document.getElementById('chatHistory');
            const chatForm = document.getElementById('chatForm');
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            
            let ws = null;
            let isConnecting = false;
            let currentAssistantMsgBody = null; // Holds the text node for streaming
            let currentCursor = null; // Typewriter cursor element
            let currentCandidatesContainer = null; // Holds the candidate cards for the current turn

            // Generate a quick random thread id for the session memory
            const threadId = 'thread_' + Math.random().toString(36).substring(2, 9);

            function connectWebSocket() {
                if (isConnecting || (ws && ws.readyState === WebSocket.OPEN)) return;
                
                isConnecting = true;
                updateWsStatus('Connecting...', 'disconnected');
                
                // If running on a different port (like Live Server 5500), point to 8000 explicitly
                const defaultApiUrl = 'localhost:8000';
                const host = window.location.port === '5500' || window.location.port !== '8000' && window.location.hostname === '127.0.0.1' 
                                ? defaultApiUrl 
                                : window.location.host;
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';             
                const wsUrl = `${protocol}//${host}/ws/search`;

                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    isConnecting = false;
                    updateWsStatus('Connected', 'connected');
                    sendBtn.disabled = false;
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        handleStreamEvent(data);
                    } catch (e) {
                        console.error("Error parsing websocket message", e);
                    }
                };

                ws.onclose = () => {
                    isConnecting = false;
                    updateWsStatus('Reconnecting...', 'disconnected');
                    sendBtn.disabled = true;
                    removeCursor(); // Clean up incomplete cursor if dropped
                    // Auto-reconnect after 3 seconds
                    setTimeout(connectWebSocket, 3000);
                };

                ws.onerror = (error) => {
                    console.error('WebSocket Error:', error);
                    ws.close();
                };
            }

            function updateWsStatus(text, statusClass) {
                wsStatusText.textContent = text;
                wsStatusIndicator.className = `ws-status ${statusClass}`;
            }

            // --- Chat UI Handling ---

            function appendMessage(role, text) {
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${role}-msg`;

                const avatarIcon = role === 'user' ? 'fa-user' : 'fa-robot';
                msgDiv.innerHTML = `
                    <div class="avatar"><i class="fa-solid ${avatarIcon}"></i></div>
                    <div class="message-content">
                        <span class="msg-text">${text}</span>
                    </div>
                `;
                
                chatHistory.appendChild(msgDiv);
                scrollToBottom();
                
                // Return references if it's an assistant message so we can stream into it
                if (role === 'assistant') {
                    const contentDiv = msgDiv.querySelector('.message-content');
                    return contentDiv; // We'll append candidates and text here
                }
                return null;
            }

            function createAssistantPlaceholder() {
                // Create an empty assistant bubble with a cursor ready to receive text
                const contentDiv = appendMessage('assistant', '');
                const textSpan = contentDiv.querySelector('.msg-text');
                
                // Add cursor
                const cursor = document.createElement('span');
                cursor.className = 'cursor';
                contentDiv.insertBefore(cursor, textSpan.nextSibling);

                currentAssistantMsgBody = textSpan;
                currentCursor = cursor;

                // Prepare a container below the text for candidates
                const candContainer = document.createElement('div');
                candContainer.className = 'candidates-container';
                candContainer.style.display = 'none'; // hide until we have candidates
                contentDiv.appendChild(candContainer);
                
                currentCandidatesContainer = candContainer;
            }

            function handleStreamEvent(event) {
                if (event.type === 'chunk') {
                    if (currentAssistantMsgBody) {
                        currentAssistantMsgBody.textContent += event.content;
                        scrollToBottom();
                    }
                } 
                else if (event.type === 'candidates') {
                    let candidates = event.data;
                    console.log("Received candidates payload:", candidates);
                    
                    // Normalize LLM output to an array
                    if (!Array.isArray(candidates)) {
                        if (candidates && Array.isArray(candidates.candidates)) {
                            candidates = candidates.candidates;
                        } else if (candidates && Array.isArray(candidates.results)) {
                            candidates = candidates.results;
                        } else if (candidates && Array.isArray(candidates.data)) {
                            candidates = candidates.data;
                        } else if (candidates && typeof candidates === 'object') {
                            // Single candidate object
                            candidates = [candidates];
                        } else {
                            candidates = [];
                        }
                    }

                    if (candidates && candidates.length > 0 && currentCandidatesContainer) {
                        currentCandidatesContainer.style.display = 'flex';
                        renderCandidates(candidates, currentCandidatesContainer);
                        scrollToBottom();
                    } else if (!currentCandidatesContainer) {
                        console.error("Candidates received, but no container was ready in the UI.");
                    } else {
                        console.warn("Candidates array was empty or failed to parse.", event.data);
                    }
                }
                else if (event.type === 'done' || event.type === 'error') {
                    onAssistantTurnComplete();
                    if (event.type === 'error') {
                        if (currentAssistantMsgBody) {
                            currentAssistantMsgBody.textContent += `\n\n❌ Error: ${event.content}`;
                        }
                    }
                }
            }

            function onAssistantTurnComplete() {
                removeCursor();
                currentAssistantMsgBody = null;
                currentCandidatesContainer = null;
                sendBtn.disabled = false;
                userInput.focus();
            }

            function removeCursor() {
                if (currentCursor && currentCursor.parentNode) {
                    currentCursor.parentNode.removeChild(currentCursor);
                    currentCursor = null;
                }
            }

            function renderCandidates(candidates, container) {
                candidates.forEach((cand, idx) => {
                    const card = document.createElement('div');
                    card.className = 'candidate-card';
                    
                    const name = cand.name || 'Unknown Candidate';
                    const exp = cand.total_experience || 'N/A';
                    const city = cand.city || 'N/A';
                    
                    // Format skills
                    let skillsHtml = '';
                    if (Array.isArray(cand.skills)) {
                        skillsHtml = cand.skills.map(s => `<span class="skill-tag">${s}</span>`).join('');
                    } else if (cand.skills) {
                        skillsHtml = `<span class="skill-tag">${cand.skills}</span>`;
                    }

                    card.innerHTML = `
                        <div class="cand-header">
                            <span class="cand-name">${idx + 1}. ${name}</span>
                            <button class="raw-data-btn" title="View Raw Data" onclick="alert(JSON.stringify(${JSON.stringify(cand).replace(/"/g, '&quot;')}, null, 2))">
                                <i class="fa-solid fa-code"></i> JSON
                            </button>
                        </div>
                        <div class="cand-meta">
                            <span>💼 ${exp} years</span>
                            <span>📍 ${city}</span>
                        </div>
                        ${skillsHtml ? `<div class="cand-skills">${skillsHtml}</div>` : ''}
                    `;
                    
                    container.appendChild(card);
                });
            }

            function scrollToBottom() {
                chatHistory.scrollTop = chatHistory.scrollHeight;
            }

            // --- Events ---

            chatForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const query = userInput.value.trim();
                if (!query) return;

                // Check socket
                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    alert('WebSocket is not connected. Please wait for reconnection.');
                    return;
                }

                // 1. Add User Message
                appendMessage('user', query);
                userInput.value = '';
                sendBtn.disabled = true;

                // 2. Prepare Assistant Bubble
                createAssistantPlaceholder();

                // 3. Send over Socket
                const payload = {
                    query: query,
                    thread_id: threadId
                };
                ws.send(JSON.stringify(payload));
            });

            // --- Ingestion Event ---
            const ingestBtn = document.getElementById('ingestBtn');
            const ingestStatus = document.getElementById('ingestStatus');

            ingestBtn.addEventListener('click', async () => {
                const originalText = ingestBtn.innerHTML;
                ingestBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Running...';
                ingestBtn.disabled = true;
                ingestStatus.className = 'status-box hidden';

                try {
                    // Use the same host resolution logic as the websocket
                    const defaultApiUrl = 'localhost:8000';
                    const host = window.location.port === '5500' || window.location.port !== '8000' && window.location.hostname === '127.0.0.1' 
                                    ? defaultApiUrl 
                                    : window.location.host;
                    const hProtocol = window.location.protocol;
                    const ingestUrl = `${hProtocol}//${host}/ingest`;

                    const response = await fetch(ingestUrl, { method: 'POST' });
                    const data = await response.json();

                    if (response.ok && data.status === 'success') {
                        ingestStatus.className = 'status-box success';
                        ingestStatus.innerHTML = `<strong>Success!</strong><br>Indexed: ${data.indexed}<br>Failed: ${data.failed}`;
                    } else {
                        throw new Error(data.detail || 'Unknown error');
                    }
                } catch (error) {
                    ingestStatus.className = 'status-box error';
                    ingestStatus.innerText = error.message;
                } finally {
                    ingestBtn.innerHTML = originalText;
                    ingestBtn.disabled = false;
                }
            });

            // Initialize Connection
            connectWebSocket();
        });
    </script>
</body>
</html>
