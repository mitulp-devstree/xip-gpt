
services:

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: resume_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - qdrant

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    container_name: resume_ui
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - api

volumes:
  qdrant_storage: